services:
  - type: web
    name: stackai-backend
    rootDir: backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.demo.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./stackai.db
      - key: MIN_RESERVE_AMOUNT
        value: "50000.00"
      - key: DEMO_MODE
        value: "true"
      - key: USE_AIRWALLEX_SIMULATOR
        value: "true"
